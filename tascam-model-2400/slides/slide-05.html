:root{

html,body{
  width:1080px;
  height:1080px;
  background:var(--ivory);
  font-family:'Inter', sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.canvas{
  position:relative;
  width:1080px;
  height:1080px;
  overflow:hidden;
  background:var(--ivory);
}

.top-band{
  position:absolute;
  top:0; left:0;
  width:1080px;
  height:177px;
  background:var(--ivory);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
}

  background:#FFFFFF;
  border-radius:20px;
  height:132px;
  display:flex;
  align-items:center;
