  font-family:'Archivo Black', 'Inter', sans-serif;
  font-weight:400;
  line-height:0.98;
  letter-spacing:-0.01em;
  color:var(--ink);
}

.kicker{
  font-family:'Inter', sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
}

.kicker-on-dark{
  font-family:'Inter', sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--white);
  opacity:0.92;
}

.cta-pill{
  display:inline-flex;
  align-items:center;
  gap:12px;
  background:var(--accent);
  color:var(--white);
  font-family:'Inter', sans-serif;
  font-weight:700;
  font-size:27px;
  letter-spacing:0.01em;
  padding:16px 30px;
  border-radius:100px;
  white-space:nowrap;
}

.cta-pill .arrow{
  font-family:'Inter', sans-serif;
  font-weight:800;
}

.scrim-bottom{
  position:absolute;
  left:0; right:0; bottom:0;
  background:linear-gradient(180deg, rgba(12,10,8,0) 0%, rgba(12,10,8,0.55) 38%, rgba(12,10,8,0.88) 100%);
}

.scrim-block{
  background:rgba(12,10,8,0.72);
}

.hairline{
  background:var(--hairline);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--white);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.02em;
  padding:10px 18px;
  border-radius:8px;
}

.tick{
  position:absolute;
  width:44px;
  height:6px;
  background:var(--accent);
}

.slide-num{
  position:absolute;
  right:0; bottom:0;
  font-family:'Archivo Black','Inter',sans-serif;
  font-size:250px;
  line-height:0.78;
  letter-spacing:-0.03em;
  color:rgba(23,20,15,0.075);
  pointer-events:none;
  user-select:none;
}
.slide-num.on-dark{ color:rgba(255,255,255,0.14); }

.num-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:var(--white);
  font-family:'Inter', sans-serif;
  font-weight:800;
  font-size:24px;
}

  .row{ position:absolute; left:0; width:1032px; overflow:hidden; }
  .row-0{ top:0px; height:300px;  }
  .row-0 img{ width:100%; height:100%; object-fit:cover; object-position:center 35%; }
  .row-1{ top:314px; height:180px; display:flex; gap:14px; }
  .row-1 .tile{ width:509.00px; height:180px; overflow:hidden; }
  .row-1 .tile img{ width:100%; height:100%; }
  .text-block{ position:absolute; left:0; top:514px; width:920px; }
  .kicker{ margin-bottom:18px; }
  .headline{
    font-family:'Archivo Black','Inter',sans-serif;
    font-size:76px; line-height:0.98; letter-spacing:-0.01em;
    color:var(--ink); margin-bottom:30px; max-width:820px;
  }

</style>
</head>
