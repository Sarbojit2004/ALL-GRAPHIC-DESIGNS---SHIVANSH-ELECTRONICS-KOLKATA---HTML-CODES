:root{
  --cream:#F3EFE9;
  --cream-text:#FBF6EE;
  --ink:#17140F;
  --accent:#B3400C;
  --accent-deep:#8A3009;
  --zone-bg:#050505;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{width:1080px;height:1080px;}
.canvas{
  width:1080px;height:1080px;position:relative;overflow:hidden;
  background:var(--cream);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.header{position:absolute;top:0;left:0;width:1080px;height:192px;z-index:6;}
.header img{width:100%;height:100%;display:block;object-fit:fill;}

.content{position:absolute;top:192px;left:0;width:1080px;height:888px;background:var(--cream);overflow:hidden;}

/* ---- media stack: 1-3 rows of 1-4 images each, black tiles, thin cream mortar ---- */
.stack{position:absolute;left:22px;right:22px;top:0;display:flex;flex-direction:column;gap:6px;}
.stack .row{display:flex;gap:10px;min-height:0;}
.stack .row.grow-hero{flex-grow:1.5;}
.stack .row.grow-normal{flex-grow:1;}
.stack .tile{flex:1 1 0;background:var(--zone-bg);position:relative;overflow:hidden;min-width:0;}
.stack .tile img{width:100%;height:100%;object-fit:cover;display:block;}
.stack .tile img.contain{object-fit:contain;}

/* ---- footer mode: cream text panel below the stack ---- */
.footer{position:absolute;left:22px;right:22px;bottom:0;height:280px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:34px;}
.eyebrow{
  font-family:'Archivo';font-weight:800;font-size:19px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--accent);margin:0 0 12px;
}
.eyebrow.on-dark{color:var(--cream-text);}
.headline{
  font-family:'Archivo';font-weight:900;color:var(--ink);
  line-height:1.03;letter-spacing:-0.01em;margin:0 0 22px;font-size:58px;
}
.headline.on-dark{color:var(--cream-text);}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:var(--cream-text);
  font-family:'Archivo';font-weight:700;font-size:19px;
  padding:16px 28px;border-radius:999px;width:fit-content;
}
.cta .arrow{font-size:20px;line-height:1;transform:translateY(1px);}
.ghost{
  position:absolute;right:6px;bottom:-46px;
  font-family:'Archivo';font-weight:900;font-size:280px;line-height:1;
  letter-spacing:-0.02em;z-index:2;user-select:none;pointer-events:none;
  color:rgba(23,20,15,0.075);
}
.ghost.on-dark{color:rgba(255,255,255,0.16);}

/* ---- overlay mode: stack fills full content height, text overlaid with scrim ---- */
.stack.full{bottom:0;}
.scrim{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:3;
  background:linear-gradient(180deg, rgba(5,4,3,0) 46%, rgba(5,4,3,0.62) 72%, rgba(4,3,2,0.94) 100%);}
.overlay-text{position:absolute;left:64px;right:64px;bottom:46px;z-index:4;}
.overlay-text .eyebrow{color:var(--accent);}
.overlay-text .headline{color:var(--cream-text);font-size:56px;}

</style>
